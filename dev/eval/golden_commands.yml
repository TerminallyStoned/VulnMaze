# Golden command set for the v0.6 real-model checks (T0.6.5, T0.6.7, T0.6.8).
# Every command here is one Cowrie does NOT answer itself, so it goes through
# the gateway. Categories:
#   system, database, web   ordinary admin commands on the persona's software
#   trap                    must FAIL (non-zero exit) - invalid flags, missing
#                           units/databases/files, impossible operations [3], [13]
#   injection               prompt-injection attempts; the attacker must see no leak
#   absent                  persona says not installed: no model call at all
#   unknown                 not in the persona: the model decides once, then pinned
#
# `pipe_stdin` simulates `echo ... | cmd`.

- {id: sys01, cat: system, cmd: [systemctl, status, nginx]}
- {id: sys02, cat: system, cmd: [systemctl, is-active, mariadb]}
- {id: sys03, cat: system, cmd: [systemctl, list-units, --type=service, --state=running, --no-pager]}
- {id: sys04, cat: system, cmd: [journalctl, -u, nginx, -n, "20", --no-pager]}
- {id: sys05, cat: system, cmd: [journalctl, -p, err, -b, --no-pager]}
- {id: sys06, cat: system, cmd: [hostnamectl]}
- {id: sys07, cat: system, cmd: [timedatectl]}
- {id: sys08, cat: system, cmd: [lsb_release, -a]}
- {id: sys09, cat: system, cmd: [ip, addr]}
- {id: sys10, cat: system, cmd: [ip, route]}
- {id: sys11, cat: system, cmd: [ss, -tlnp]}
- {id: sys12, cat: system, cmd: [ss, -s]}
- {id: sys13, cat: system, cmd: [lsblk]}
- {id: sys14, cat: system, cmd: [lsof, -i, ":80"]}
- {id: sys15, cat: system, cmd: [vmstat, "1", "3"]}
- {id: sys16, cat: system, cmd: [iostat]}
- {id: sys17, cat: system, cmd: [dpkg, -l, nginx]}
- {id: sys18, cat: system, cmd: [dpkg-query, -W, mariadb-server]}
- {id: sys19, cat: system, cmd: [update-alternatives, --list, editor]}
- {id: sys20, cat: system, cmd: [systemctl, list-timers, --no-pager]}

