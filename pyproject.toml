[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnmaze"
version = "0.5.0"
description = "Medium-interaction Cowrie honeypot with de-identified telemetry and a deterministic command router"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Installed in the honeypot image only.
honeypot = ["cowrie==3.0.14"]
# Installed in the pipeline image (ingester, digest builder, state API).
pipeline = [
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "paramiko>=3.4",
  "asyncssh>=2.14",
  "httpx>=0.27",
  "pyyaml>=6",
  "ruff>=0.6",
]

[project.scripts]
vulnmaze-ingest = "vulnmaze.ingest.service:main"
vulnmaze-load-public = "vulnmaze.ingest.public:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vulnmaze*", "twisted.plugins"]
namespaces = true

[tool.setuptools.package-data]
"vulnmaze.db" = ["*.sql"]
"vulnmaze.cowrie_ext" = ["persona/*"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
timeout = 300
markers = [
  "db: needs PostgreSQL (set VULNMAZE_TEST_DSN)",
  "cowrie: starts a real Cowrie process locally",
  "stack: needs the docker compose stack running",
  "slow: load and latency tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
