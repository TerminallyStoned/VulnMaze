[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnmaze"
version = "0.6.1"
description = "Medium-interaction Cowrie honeypot with de-identified telemetry, a deterministic command router and a hardened local LLM gap-filler"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Installed in the honeypot image only.
honeypot = ["cowrie==3.1.2"]
# Installed in the pipeline image (ingester, digest builder, state API, LLM gateway).
pipeline = [
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
]
ml = ["scikit-learn>=1.5"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "paramiko>=3.4",
  "asyncssh>=2.14",
  "httpx>=0.27",
  "pyyaml>=6",
  "ruff==0.17.0",
  "pre-commit>=4",
]

[project.scripts]
vulnmaze-ingest = "vulnmaze.ingest.service:main"
vulnmaze-load-public = "vulnmaze.ingest.public:main"
vulnmaze-label = "vulnmaze.labels.attack_rules:main"
vulnmaze-train-baselines = "vulnmaze.classify.baselines:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vulnmaze*", "twisted.plugins"]
namespaces = true

[tool.setuptools.package-data]
"vulnmaze.db" = ["*.sql"]
"vulnmaze.cowrie_ext" = ["persona/*"]
"vulnmaze.labels" = ["data/*.yml"]
"vulnmaze.harness" = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
timeout = 300
markers = [
  "db: needs PostgreSQL (set VULNMAZE_TEST_DSN)",
  "cowrie: starts a real Cowrie process locally",
  "stack: needs the docker compose stack running",
  "slow: load and latency tests",
  "llm: needs a real model server (set VULNMAZE_EVAL_LLM_URL); never runs in CI",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dev"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/vulnmaze/router/known_commands.py" = ["SIM905"]
"src/vulnmaze/common/deid.py" = ["SIM905"]
