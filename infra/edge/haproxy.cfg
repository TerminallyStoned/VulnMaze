# TCP pass-through to Cowrie. `send-proxy-v2` prepends a PROXY header so
# Cowrie logs the attacker's real source address, not HAProxy's.
global
    maxconn 2000
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # Long timeouts: human sessions can idle for many minutes.
    # Cowrie enforces its own idle timeout (180 s by default).
    timeout client 1h
    timeout server 1h

frontend ssh_in
    bind :2222
    default_backend cowrie

backend cowrie
    # No `check`: a health-check connection carries no PROXY header, which
    # Cowrie logs as an error every interval. There is one backend anyway.
    server cowrie cowrie:2222 send-proxy-v2
