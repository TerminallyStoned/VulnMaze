# VulnMaze Cowrie configuration. Only settings that differ from Cowrie's
# defaults (cowrie.cfg.dist) are listed. Any option can also be overridden
# with an environment variable COWRIE_<SECTION>_<OPTION>.
#
# Persona: Debian 12 (bookworm) web server. Cowrie 3.0.14's defaults are
# already Debian 12, so we keep the kernel/SSH strings and change what
# would give away a default install. Check every value against a real
# Debian 12 VM before going public.

[honeypot]
# Change from the default "svr04", which every honeypot scanner knows.
hostname = web-portal-01
sensor_name = vulnmaze-sg-01
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
download_limit_size = 10485760
logtype = rotating
idle_timeout = 180
backend = shell

[shell]
arch = linux-x64-lsb
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1 (2024-05-03)
hardware_platform = x86_64
operating_system = GNU/Linux
# `ssh -V` output; copy the exact string from a real Debian 12 host.
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.13 30 Jan 2024

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
# Only accept connections that come through HAProxy with a PROXY header.
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0
sftp_enabled = true
# Forwarding requests are logged but never connected anywhere (the dmz
# network has no route out anyway).
forwarding = true
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
