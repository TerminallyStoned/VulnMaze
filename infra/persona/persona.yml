# The machine the attacker thinks they are on. The LLM gateway builds its
# system prompt from this file and checks every model answer against it.
#
# It MUST agree with infra/honeypot/cowrie.cfg (hostname, kernel) and with
# Cowrie's filesystem; a consistency test fails if they drift apart.
# Verify versions against a real Debian 12 machine before deploying.

hostname: web-portal-01
os:
  pretty_name: "Debian GNU/Linux 12 (bookworm)"
  id: debian
  version_id: "12"
  codename: bookworm
kernel: 6.1.0-21-amd64
arch: x86_64
role: >-
  Public web server for a municipal e-services portal. nginx serves a PHP
  application from /var/www/portal; MariaDB holds the application database
  on the same host. Administered over SSH by a small IT team.

# Facts every answer must agree with. Keys are free-form; the values are
# shown to the model verbatim and some are checked by the contradiction
# detector (hostname, kernel, OS name and codename).
facts:
  primary_ip: 10.20.4.17
  gateway: 10.20.4.1
  timezone: Asia/Singapore
  nginx_version: 1.22.1
  php_version: 8.2.20
  mariadb_version: 10.11.6-MariaDB-0+deb12u1
  openssl_version: 3.0.13
  database_name: portal
  web_root: /var/www/portal
  services_running: nginx, php8.2-fpm, mariadb, ssh, cron, rsyslog

# Honeytokens for learned mode: one bait file per predicted ATT&CK tactic,
# planted once per attacker in a session worth deceiving. `contents` tells
# the model what the file holds; every value in it is fake.
baits:
  Discovery:
    path: /var/www/portal/config/database.php
    contents: the portal's PHP database settings as define() lines, with host localhost, database portal, user portal_app and its password
  Privilege Escalation:
    path: /root/.my.cnf
    contents: a MariaDB client config with a [client] section for user root and its password
  Persistence:
    path: /etc/cron.d/portal-backup
    contents: a cron entry that runs /usr/local/sbin/portal-backup.sh as root at 02:30 every night and copies the dump to backup host 10.20.4.40 with rsync
  Command and Control:
    path: /usr/local/sbin/portal-update.sh
    contents: a bash script that downloads the latest portal release from the internal mirror 10.20.4.30 with curl and an access token, unpacks it into /var/www/portal and restarts php8.2-fpm
  Exfiltration:
    path: /var/backups/portal/portal-db.sql
    contents: the first lines of a mysqldump of the portal database, with the CREATE TABLE and first INSERT rows of the users table (usernames, e-mail addresses and bcrypt password hashes)

# Command existence. `installed` commands are answered by the LLM (if Cowrie
# does not already implement them). `absent` commands always get bash's
# "command not found", with no model call. Anything in neither list is
# decided by the model once, then pinned for every attacker.
commands:
  installed:
    - systemctl
    - journalctl
    - ip
    - ss
    - lsblk
    - lsof
    - lsb_release
    - mysql
    - mariadb
    - mysqldump
    - mysqladmin
    - nginx
    - php-fpm8.2
    - openssl
    - rsync
    - zip
    - htop
    - vmstat
    - iostat
    - dpkg
    - dpkg-query
    - hostnamectl
    - timedatectl
    - logrotate
    - sshd
    - update-alternatives
  absent:
    - masscan
    - nmap
    - zmap
    - hydra
    - medusa
    - john
    - hashcat
    - xmrig
    - docker
    - podman
    - kubectl
    - aws
    - gcloud
    - az
    - terraform
    - ansible
    - screen
    - tmux
    - go
    - node
    - npm
    - java
    - ruby
    - socat
    - ncat
